name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run pip-audit
      run: |
        pip install pip-audit
        pip-audit --desc

# A CodeQL job used to live here. It can only upload its results where code
# scanning is enabled, and on a private repository under a personal account
# that requires a paid plan -- so every run failed on the upload step. Restore
# it if this repository ever becomes public.
