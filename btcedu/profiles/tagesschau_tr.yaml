name: tagesschau_tr
display_name: "Tagesschau News (DE→TR)"
source_language: de
target_language: tr
domain: news
pipeline_version: 2
branding:
  show_name: "ALMANYA24"
  # How the brand looks on screen and how it is pronounced. "ALMANYA24" read
  # literally produces the wrong Turkish suffix ("ALMANYA24'na"), so spoken
  # text uses the written-out form and declines that instead.
  display_name: "ALMANYA24"
  spoken_name: "Almanya Yirmi Dört"
  slogan: "Almanya'nın nabzı burada atıyor."
  # The programme is an independent Turkish-language production. Source
  # provenance stays in the story documents, QA artifacts and the video
  # description - but never on screen.
  visible_source_attribution: false
stages_enabled: all
stage_config:
  transcription:
    primary:
      provider: openai
      model: whisper-1
    secondary:
      enabled: true
      provider: openai
      model: gpt-4o-mini-transcribe
      mode: suspicious_segments_only
      minimum_severity: major
    suspicious_segment_context_seconds: 15
    max_secondary_audio_seconds: 300
    max_secondary_clips: 10
  transcript_analyze:
    enabled: true
  transcript_verify:
    enabled: true
  transcript_qa:
    enabled: true
    block_on_critical: true
    max_major_findings: 3
    auto_continue_below_threshold: true
  translation_qa:
    enabled: true
  qa:
    enabled: true
    # Deterministic checks run first and never cost anything.
    deterministic_checks: true
    # Standard independent second-opinion model (different from the producer).
    standard:
      provider: copilot_cli
      model: gpt-5.6-sol
    # Stronger escalation model, only invoked for high-risk triggers.
    escalation:
      enabled: true
      provider: copilot_cli
      model: claude-opus-4.6
      trigger_on:
        - suspected_hallucination
        - missing_story
        - casualty_claim
        - legal_claim
        - unresolved_transcript
        - contradictory_findings
    quality_gate:
      max_automatic_retries: 2
      block_on_critical: true
      block_on_missing_story: true
      block_on_unresolved_transcript: true
      max_minor_findings: 4
    # Automatic adjudication of a non-green gate. GPT-5.6 reviews the open
    # findings and decides; block_on_hold=false means the pipeline never halts
    # at review_gate_2 and continues automatically (decisions are recorded in
    # gate_adjudication.json).
    gate_adjudication:
      enabled: true
      provider: copilot_cli
      model: gpt-5.6-sol
      block_on_hold: false
  segment:
    enabled: true
  adapt:
    # Conditional, story-preserving polish only; never a full rewrite.
    skip: false
    mode: conditional
    tiers: [anchor_unify, local_relevance]
    allowed_operations:
      - anchor_unify
      - institution_explanation
      - local_relevance
      - register_polish
    preserve_facts: true
    preserve_numbers: true
    preserve_story_ids: true
  imagegen:
    provider: generative
    fallback_provider: ideogram
    deterministic_exact_data: true
    prompt_template: imagegen_news.md
    style_prefix: "Photorealistic editorial news photograph, documentary photojournalism, natural light, shallow depth of field. Neutral, journalistic tone, restrained blue and white colour palette. Show the subject of the story on location. Never a television studio, never a news desk, never a presenter or anchor, never a person addressing the camera, and never a flat vector illustration. Absolutely no readable text, no captions, no headlines, no lower thirds, no station logos, no channel names, no watermarks and no signage of any kind anywhere in the image. "
  translate:
    mode: per_story
    register: formal_news
    clean_moderator: true
    use_glossary: true
    validation_adjudication:
      enabled: true
      provider: copilot_cli
      model: gpt-5.6-sol
  script:
    # Turns the approved translation into a two-presenter broadcast script.
    enabled: true
    provider: copilot_cli
    model: gpt-5.6-sol
    prompt_template: script_broadcast.md
    # QA reads the *_total_seconds keys; the programme aims at 9-11 minutes.
    target_total_seconds: 600
    min_total_seconds: 540
    max_total_seconds: 660
    # The anchor moderates the programme rather than reading a share of it, so
    # she carries 35-45% of the spoken words.
    anchor_share_target: [0.35, 0.45]
    max_revisions: 1
    editorial:
      # Duration is an editorial guideline, not a hard box. Going long is only
      # a problem when the extra minutes come from repetition or padding.
      minimum_duration_seconds: 540
      preferred_duration_seconds: 600
      soft_maximum_duration_seconds: 660
      hard_maximum_duration_seconds: null
      allow_longer_if_editorially_justified: true
    # Programme framing. The system owns greeting, headline block and closing so
    # the bulletin cannot greet its audience differently every day; the variants
    # keep it from sounding identical either.
    openings:
      - "İyi akşamlar, {show_name_dative} hoş geldiniz.\
         \ Almanya'nın ve dünyanın gündemindeki gelişmelerle karşınızdayız."
      - "İyi akşamlar. {show_name} başlıyor.\
         \ Günün öne çıkan haberlerini ve Almanya'daki yansımalarını aktarıyoruz."
      - "İyi akşamlar, hoş geldiniz.\
         \ {show_name} ile günün gelişmelerini ve bunların Almanya'daki anlamını konuşuyoruz."
      - "İyi akşamlar. {show_name_dative} hoş geldiniz.\
         \ Bugünün gündemini ve sizi doğrudan ilgilendiren gelişmeleri derledik."
    headline_intros:
      - "Bülteni açan başlıklar şöyle."
      - "Önce günün öne çıkan başlıkları."
      - "Bu akşamki bültenin başlıkları."
    headline_outros:
      - "{topic} ile başlıyoruz."
      - "Bültene {topic} başlığıyla başlıyoruz."
      - "İlk haberimiz {topic}."
    weather_handovers:
      - "Bültenimizi hava durumuyla tamamlıyoruz."
      - "Haberlerin ardından şimdi hava durumuna bakıyoruz."
      - "Son olarak Almanya genelinde hava nasıl olacak, ona bakalım."
    closings:
      - "Bugün öne çıkan gelişmeleri sizlere aktardık.\
         \ Gün boyunca yaşanan gelişmeleri takip etmeye devam edeceğiz.\
         \ Yeni haber bülteninde yeniden görüşmek üzere, iyi akşamlar."
      - "Bugünkü bültenimizin sonuna geldik. Bizi izlediğiniz için teşekkür ederiz.\
         \ Gelişmeleri izlemeye ve sizlere aktarmaya devam edeceğiz. İyi akşamlar."
      - "Günün gündemini bu bültende topladık.\
         \ Yeni gelişmeleri takip etmeyi sürdürüyoruz.\
         \ Yeniden görüşmek üzere, iyi akşamlar."
  tts:
    voice_id: "Q2IX97JeHBY3vNGzgM5s"  # Cavit (fallback / single-voice episodes)
    voices:
      anchor_female:
        # Main anchor: Nazlı Yeni (Istanbul accent, professional).
        display_name: "Nazlı Yeni"
        voice_id: "o9DOmAyPjfFu8AfoFAnM"
        stability: 0.5
        similarity_boost: 0.75
        style: 0.3
        speed: 1.05
      reporter_male:
        display_name: "Cavit"
        voice_id: "Q2IX97JeHBY3vNGzgM5s"
        stability: 0.45
        similarity_boost: 0.75
        style: 0.35
        speed: 1.08
    stability: 0.45
    similarity_boost: 0.75
    style: 0.35
    speed: 1.08
    model: eleven_turbo_v2_5
    # Deterministic display→spoken substitutions applied ONLY to the synthesized
    # audio; the locked/approved narration text is never modified. Add German
    # names/tickers a Turkish voice mispronounces, e.g.:
    #   pronunciation_lexicon:
    #     "Scholz": "Şolts"
    #     "Bundeswehr": "Bundesver"
    pronunciation_lexicon: {}
    # Spell numbers out for the engine: "%70" -> "yüzde yetmiş", "20.00" ->
    # "saat sekiz", "2,75 milyon" -> "iki milyon yedi yüz elli bin". Applied to
    # the synthesized audio only — the narration, topic cards and lower thirds
    # keep their digits, which read better on screen than in the ear.
    # Set to false to hand the digits to ElevenLabs unchanged.
    speech_normalization: true
  render:
    accent_color: "#004B87"
    ticker_enabled: true
    # No Ken Burns. zoompan crops from the source image at whole-pixel
    # granularity, and a 4% move spread over a whole shot advances by less than
    # a pixel per frame for long stretches and then jumps — which reads as a
    # judder rather than as a slow drift. A still picture is what a newscast
    # shows anyway. (RENDER_KEN_BURNS_ENABLED in .env stays on for other
    # profiles.)
    ken_burns_enabled: false
    intro_enabled: true
    intro_audio: "data/assets/tagesschau_tr/intro.mp3"
    intro_duration: 5.5
    intro_show_name: "ALMANYA24"
    intro_slogan: "Almanya'nın nabzı burada atıyor."
    intro_episode_title: "Almanya Gündemi"
    topic_intro_enabled: true
    topic_intro_duration: 2.4
    topic_intro_label: "GÜNDEM"
    # The card names the topic; "03 / 06" is production bookkeeping and adds
    # nothing for the viewer.
    topic_intro_show_counter: false
    topic_intro_audio: "data/assets/tagesschau_tr/intro.mp3"
    # The anchor already thanks the audience out loud, so the card carries the
    # brand instead of repeating it.
    outro_text: "ALMANYA24 — Almanya'nın nabzı burada atıyor."
    font: "Roboto-Condensed-Bold"
    music_bed: "data/assets/music/news_bed.mp3"
  weather:
    enabled: true
    detection:
      min_confidence: 0.75
    extraction:
      provider: deterministic
      require_source_spans: true
      # Narration claims stay 100% deterministic; no external source may create
      # or modify a claim shown as narration content.
      allow_external_weather_data: false
    # Attributed context data: per-city temperatures shown on the map and in a
    # side panel. Never used for claim validation.
    city_temperatures:
      enabled: true
      provider: open_meteo
      model: icon_seamless
      timeout_seconds: 20
      cities: [hamburg, berlin, cologne, frankfurt, stuttgart, munich]
    rendering:
      engine: html_svg_chromium
      resolution:
        width: 1920
        height: 1080
      fps: 25
      template: germany_news_v1
      animation_level: subtle
    branding:
      title: "Hava Durumu"
      accent_color: "#004B87"
      show_channel_logo: true
    fallback:
      allow_generic_weather_template: true
      allow_general_story_fallback: true
      prohibit_blank_frames: true
    review:
      block_on_unsupported_claim: true
      block_on_blank_visual: true
youtube:
  category_id: "25"
  default_language: tr
  default_privacy: unlisted
  tags: [haberler, almanya, türkçe, tagesschau]
review_gates: {}
prompt_namespace: tagesschau_tr
# Run the pipeline fully automatically: skip all human review gates
# (review_gate_1/2/stock/3) and stop before the actual YouTube upload.
auto_approve_reviews: true
auto_publish: false
ingest:
  # Ingest the main 20:00 Uhr broadcast and the "100 Sekunden" edition;
  # skip 16:00 Uhr, tagesthemen, nachtmagazin and other formats.
  title_include: "(?i)tagesschau.*(20[:.]?00\\s*Uhr|100\\s*Sekunden)"
  retention_days: 10
  # Preferred source: the local ard-recorder capture, ready ~20:21 - one to two
  # hours before the same broadcast appears on YouTube. The YouTube feed remains
  # the fallback and is used unchanged whenever no local file exists.
  local_recorder:
    enabled: true
    base_dir: /mnt/photo-backup/tagesschau/recordings
    # Once the local file for a broadcast day has been ingested, the YouTube
    # entry for that same day must not create a second episode. A full duplicate
    # run would repeat transcription, translation, TTS and image generation at
    # full API cost.
    supersedes_feed: true
