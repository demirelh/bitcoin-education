name: tagesschau_tr
display_name: "Tagesschau News (DE→TR)"
source_language: de
target_language: tr
domain: news
pipeline_version: 2
stages_enabled: all
stage_config:
  transcription:
    primary:
      provider: openai
      model: whisper-1
    secondary:
      enabled: true
      provider: openai
      model: gpt-4o-mini-transcribe
      mode: suspicious_segments_only
    suspicious_segment_context_seconds: 15
    max_secondary_audio_seconds: 300
    max_secondary_clips: 10
  transcript_analyze:
    enabled: true
  transcript_qa:
    enabled: true
    block_on_critical: true
    max_major_findings: 3
    auto_continue_below_threshold: true
  segment:
    enabled: true
  adapt:
    skip: false
    tiers: [anchor_unify, local_relevance]
  imagegen:
    provider: generative
    fallback_provider: ideogram
    prompt_template: imagegen_news.md
    style_prefix: "Photorealistic editorial news illustration in the visual style of a European public-broadcaster newscast (ARD/Tagesschau). Neutral, journalistic tone, clean broadcast composition, restrained blue and white color palette. "
  translate:
    mode: per_story
    register: formal_news
    clean_moderator: true
    use_glossary: true
  tts:
    voice_id: "NsFK0aDGLbVusA7tQfOB"  # Irem (tr, female) — livelier than POLAT
    stability: 0.45
    similarity_boost: 0.75
    style: 0.35
    speed: 1.08
    model: eleven_turbo_v2_5
  render:
    accent_color: "#004B87"
    ticker_enabled: true
    intro_show_name: "Tagesschau Türkçe"
    outro_text: "Kaynak: ARD Tagesschau — Türkçe altyazı & çeviri"
    font: "Roboto-Condensed-Bold"
    music_bed: "data/assets/music/news_bed.mp3"
youtube:
  category_id: "25"
  default_language: tr
  default_privacy: unlisted
  tags: [haberler, almanya, türkçe, tagesschau]
review_gates: {}
prompt_namespace: tagesschau_tr
# Run the pipeline fully automatically: skip all human review gates
# (review_gate_1/2/stock/3) and stop before the actual YouTube upload.
auto_approve_reviews: true
auto_publish: false
ingest:
  # Ingest the main 20:00 Uhr broadcast and the "100 Sekunden" edition;
  # skip 16:00 Uhr, tagesthemen, nachtmagazin and other formats.
  title_include: "(?i)tagesschau.*(20[:.]?00\\s*Uhr|100\\s*Sekunden)"
