<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp — btcedu</title>
  <link rel="stylesheet" href="static/styles.css">
  <style>
    .wa-wrap { max-width: 560px; margin: 32px auto; padding: 0 16px; }
    .wa-card { background: var(--panel, #1b1f27); border: 1px solid var(--border, #2a3039);
               border-radius: 14px; padding: 24px; text-align: center; }
    .wa-card h2 { margin: 0 0 4px; font-size: 20px; }
    .wa-hint { color: var(--muted, #9aa4b2); font-size: 14px; line-height: 1.5; margin: 8px 0 18px; }
    .wa-qr { background: #fff; padding: 12px; border-radius: 12px; width: 300px; height: 300px; }
    .wa-big { font-size: 64px; margin: 24px 0 8px; }
    .wa-status { display: inline-block; margin-top: 16px; padding: 6px 14px; border-radius: 999px;
                 font-size: 13px; background: var(--border, #2a3039); }
    .wa-status.ok { background: #16351f; color: #7ee2a0; }
    .wa-status.warn { background: #3a2f16; color: #f0c674; }
    .wa-status.err { background: #3a1c1c; color: #f08c8c; }
    .wa-meta { color: var(--muted, #9aa4b2); font-size: 13px; margin-top: 10px; }
    .wa-actions { margin-top: 18px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .wa-steps { text-align: left; color: var(--muted, #9aa4b2); font-size: 13px;
                line-height: 1.7; margin: 18px auto 0; max-width: 360px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-row">
      <h1>btcedu</h1>
      <div class="channel-selector"><span>WhatsApp-Benachrichtigungen</span></div>
    </div>
    <div class="topbar-row">
      <button class="btn" onclick="location.href='./'">← Dashboard</button>
      <button class="btn" onclick="waRefresh()">Aktualisieren</button>
    </div>
  </div>

  <div class="wa-wrap">
    <div class="wa-card">
      <h2>Gerät verknüpfen</h2>
      <p class="wa-hint">WhatsApp → Einstellungen → Verknüpfte Geräte → Gerät verknüpfen</p>
      <div id="wa-body"></div>
      <div id="wa-status" class="wa-status">lade …</div>
      <div id="wa-meta" class="wa-meta"></div>
      <div class="wa-actions">
        <button class="btn" onclick="waTest()">Testnachricht senden</button>
        <button class="btn" onclick="waRelink()">Neu verknüpfen</button>
      </div>
      <div class="wa-steps">
        Der QR-Code wird alle paar Sekunden erneuert — einfach den aktuell angezeigten scannen.
        Nach dem Verknüpfen werden wartende Nachrichten automatisch zugestellt.
      </div>
    </div>
  </div>

  <script>
    let waTimer = null;

    async function waRefresh() {
      const body = document.getElementById('wa-body');
      const status = document.getElementById('wa-status');
      const meta = document.getElementById('wa-meta');
      try {
        const response = await fetch('api/whatsapp/status', { cache: 'no-store' });
        const data = await response.json();
        if (data.connected) {
          body.innerHTML = '<div class="wa-big">✅</div>';
          status.className = 'wa-status ok';
          status.textContent = 'verbunden';
        } else if (data.dataUrl) {
          body.innerHTML = '<img class="wa-qr" alt="WhatsApp QR-Code" src="' + data.dataUrl + '">';
          status.className = 'wa-status warn';
          status.textContent = 'warte auf Scan (' + data.status + ')';
        } else {
          body.innerHTML = '<div class="wa-big">📵</div>';
          status.className = 'wa-status err';
          status.textContent = data.error || data.status || 'kein QR-Code verfügbar';
        }
        const parts = [];
        if (data.account) parts.push('Konto: ' + data.account);
        if (typeof data.queued === 'number') parts.push('wartende Nachrichten: ' + data.queued);
        meta.textContent = parts.join(' · ');
      } catch (error) {
        body.innerHTML = '<div class="wa-big">📵</div>';
        status.className = 'wa-status err';
        status.textContent = 'Dienst nicht erreichbar';
        meta.textContent = '';
      }
    }

    async function waRelink() {
      if (!confirm('Bestehende WhatsApp-Sitzung verwerfen und neuen QR-Code erzeugen?')) return;
      await fetch('api/whatsapp/relink', { method: 'POST' });
      setTimeout(waRefresh, 1500);
    }

    async function waTest() {
      const response = await fetch('api/whatsapp/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
      const data = await response.json();
      alert(data.success ? 'Testnachricht wurde übergeben.' : 'Fehler: ' + (data.error || 'unbekannt'));
      waRefresh();
    }

    waRefresh();
    waTimer = setInterval(waRefresh, 5000);
  </script>
</body>
</html>
