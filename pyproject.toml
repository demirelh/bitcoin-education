[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-education"
version = "0.1.0"
description = "Automated pipeline: German Bitcoin podcast → Turkish educational content"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",

    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "feedparser>=6.0.0",
    "yt-dlp>=2024.0.0",
    "pydub>=0.25.0",
    "requests>=2.31.0",
    "json-repair>=0.30.0",
    "jinja2>=3.1.0",
    # Used by the weather renderer's last-resort fallback, the image
    # generator, stock images and the final review. It was never declared and
    # only happened to be present on the Pi, so a fresh install built to the
    # documented instructions had no weather card fallback at all.
    "pillow>=10.0.0",
    # pydub imports the stdlib `audioop`, which 3.13 removed. Without the
    # backport pydub falls through to `pyaudioop` and dies on import, so
    # transcription chunking fails on exactly the Python this runs on.
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.optional-dependencies]
web = [
    "flask>=3.0.0",
    "gunicorn>=22.0.0",
]
youtube = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
]
frames = [
    "opencv-python-headless>=4.8",
]
# Reads back a generated take to catch a stuttered opening. Optional because
# the check disables itself when the package is absent, but without it the
# check never runs — install it wherever takes are actually bought.
speechcheck = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0.0",
    # Pinned to a minor series: the formatter is allowed to change its output
    # between releases, and an unpinned one turns every CI run into a lottery.
    "ruff>=0.15,<0.16",
    "flask>=3.0.0",
]

[project.scripts]
btcedu = "btcedu.cli:cli"

[tool.setuptools.packages.find]
include = ["btcedu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = [
    "UP042",  # Keep str,Enum pattern for Python 3.12 compatibility
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
