# Start the btcedu pipeline the moment a recording is finished, instead of
# waiting for the next tick of btcedu-run.timer.
#
# The timer keeps running every ten minutes as the safety net: OnSuccess only
# fires when the recorder exits cleanly, so a failed or interrupted run (and
# the YouTube fallback path) is still picked up the usual way.
#
# This waits for the *service* rather than the .DONE marker on purpose. The
# marker is written before the recording is remuxed into its final .mp4, and
# btcedu's ingest refuses a recording whose final file is not there yet.
#
# Owned by the btcedu repo: deploy/ard-recorder-btcedu-trigger.conf
[Unit]
OnSuccess=btcedu-run.service
